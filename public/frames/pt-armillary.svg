<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- the armillary sphere from the flag, in gold: the outer ring, the
       equator, the tilted ecliptic and the axis through them -->
  <g fill="none" stroke="#e8c34a" stroke-linecap="round">
    <circle cx="20" cy="19" r="15" stroke-width="2.2"/>
    <ellipse cx="20" cy="19" rx="15" ry="4.6" stroke-width="1.5"/>
    <ellipse cx="20" cy="19" rx="15" ry="4.6" stroke-width="1.5" transform="rotate(-58 20 19)"/>
    <line x1="13" y1="6.2" x2="27" y2="31.8" stroke-width="1.6"/>
  </g>
  <g fill="#e8c34a">
    <circle cx="13" cy="6.2" r="1.6"/>
    <circle cx="27" cy="31.8" r="1.6"/>
    <path d="M17 39 L23 39 L21.6 35.5 L18.4 35.5 Z"/>
    <rect x="19.1" y="33.5" width="1.8" height="2.4"/>
  </g>
</svg>
