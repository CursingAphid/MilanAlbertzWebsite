    <path id="atBottomArc" d="M50 50m-26 0a26 26 0 1 0 52 0"/>
  </defs>
  <g fill="none" stroke="#b02330">
    <circle cx="50" cy="50" r="46" stroke-width="2.6"/>
    <circle cx="50" cy="50" r="41.5" stroke-width="1.2"/>
  </g>
  <g fill="#b02330" font-family="Helvetica, Arial, sans-serif">
    <text font-size="9.5" font-weight="bold" letter-spacing="1">
      <textPath href="#atTopArc" startOffset="50%" text-anchor="middle">ÖSTERREICH</textPath>
