<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144">
  <!-- chalet wood frame for border-image (slice 48 rendered at ~16px, a 3x
       downscale). Concentric solid bands survive 9-slice stretching without
       artifacts; fine carved lines and small flowers turn to mush, so the
       profile is bold: dark rim, lit bevel, wide plank, shadow groove,
       brass bead, dark inner rim — plus one BIG edelweiss per corner. -->
  <g fill="none">
    <rect x="2" y="2" width="140" height="140" stroke="#2e2115" stroke-width="4"/>
    <rect x="7" y="7" width="130" height="130" stroke="#8a6a45" stroke-width="6"/>
    <rect x="22" y="22" width="100" height="100" stroke="#6e4f30" stroke-width="24"/>
    <rect x="37" y="37" width="70" height="70" stroke="#4a3421" stroke-width="6"/>
    <rect x="42" y="42" width="60" height="60" stroke="#caa36b" stroke-width="4"/>
    <rect x="46" y="46" width="52" height="52" stroke="#33251a" stroke-width="4"/>
  </g>
  <defs>
    <g id="edelweiss">
      <g fill="#f4f1e8">
        <ellipse rx="4.5" ry="14"/>
        <ellipse rx="4.5" ry="14" transform="rotate(30)"/>
        <ellipse rx="4.5" ry="14" transform="rotate(60)"/>
        <ellipse rx="4.5" ry="14" transform="rotate(90)"/>
        <ellipse rx="4.5" ry="14" transform="rotate(120)"/>
        <ellipse rx="4.5" ry="14" transform="rotate(150)"/>
      </g>
      <circle r="6" fill="#e8c34a"/>
      <circle cx="-2.2" cy="-1.6" r="1.7" fill="#c9a227"/>
      <circle cx="2.4" cy="1.2" r="1.7" fill="#c9a227"/>
    </g>
  </defs>
  <use href="#edelweiss" transform="translate(24 24)"/>
  <use href="#edelweiss" transform="translate(120 24)"/>
  <use href="#edelweiss" transform="translate(24 120)"/>
  <use href="#edelweiss" transform="translate(120 120)"/>
</svg>
