<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 58">
  <!-- Treichel: the big Swiss cowbell on its embroidered strap -->
  <path d="M9 0 L25 0 L25 20 L9 20 Z" fill="#7d4a22"/>
  <path d="M9 0 L25 0 L25 20 L9 20 Z" fill="none" stroke="#5c3517" stroke-width="1.2"/>
  <g fill="#e8dcc4">
    <rect x="11.6" y="4" width="1.6" height="5" rx="0.3"/>
    <rect x="10" y="5.7" width="4.8" height="1.6" rx="0.3"/>
    <rect x="20.8" y="4" width="1.6" height="5" rx="0.3"/>
    <rect x="19.2" y="5.7" width="4.8" height="1.6" rx="0.3"/>
    <rect x="16.2" y="12.5" width="1.6" height="5" rx="0.3"/>
    <rect x="14.6" y="14.2" width="4.8" height="1.6" rx="0.3"/>
  </g>
  <!-- the bell: shoulders flaring to a wide rim -->
  <path d="M13 20 L21 20 L23.5 25 C27.5 31 30 39 30 45 L4 45 C4 39 6.5 31 10.5 25 Z" fill="#b98a3c"/>
  <path d="M17 20 L21 20 L23.5 25 C27.5 31 30 39 30 45 L20 45 C20.5 38 20 28 17 20 Z" fill="#9c7029"/>
  <rect x="3" y="44" width="28" height="5" rx="2" fill="#cfa04c"/>
  <rect x="3" y="47.5" width="28" height="1.8" rx="0.9" fill="#8a6320"/>
  <!-- clapper -->
  <path d="M17 45 L17 52" stroke="#6b5326" stroke-width="1.4"/>
  <circle cx="17" cy="53.6" r="3.1" fill="#8a6a34"/>
</svg>
