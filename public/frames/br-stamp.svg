    </text>
    <text x="50" y="53" font-size="9" font-weight="bold" letter-spacing="2.5" text-anchor="middle">ENTRADA</text>
  </g>
  <g stroke="#2e8b57" stroke-width="1.1">
    <line x1="35" y1="42" x2="65" y2="42"/>
    <line x1="35" y1="58" x2="65" y2="58"/>
  </g>
</svg>
