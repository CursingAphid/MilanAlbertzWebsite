<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 18">
  <!-- canal-house gables + windmill skyline tile for the card's top strip -->
  <rect width="96" height="18" fill="#f4f1e8"/>
  <g fill="#1f3d7a">
    <!-- stepped gable -->
    <path d="M2 18 V8 h3 V5 h3 V2 h4 v3 h3 v3 h3 v10 Z"/>
    <!-- neck gable -->
    <path d="M24 18 V9 h4 V4 h8 v5 h4 v9 Z"/>
    <!-- bell gable -->
    <path d="M44 18 v-8 C44 5 48 3 53 3 c5 0 9 2 9 7 v8 Z"/>
    <!-- windmill: tower + cap -->
    <path d="M72 18 L74 8 h12 l2 10 Z"/>
    <path d="M74 8 C74 4 86 4 86 8 Z"/>
  </g>
  <!-- windmill blades -->
  <path d="M74 0 L86 12 M86 0 L74 12" stroke="#1f3d7a" stroke-width="1.6"/>
  <!-- windows -->
  <g fill="#f4f1e8">
    <rect x="8" y="10" width="2.4" height="3.4"/>
    <rect x="13" y="10" width="2.4" height="3.4"/>
    <rect x="28.5" y="11" width="2.4" height="3.4"/>
    <rect x="33" y="11" width="2.4" height="3.4"/>
    <rect x="49" y="10" width="2.4" height="3.4"/>
    <rect x="54.5" y="10" width="2.4" height="3.4"/>
    <rect x="78.5" y="11" width="3" height="4.5"/>
  </g>
</svg>
