<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 20">
  <!-- alpine ridgeline tile for the card's top strip. The seam peak is
       drawn at BOTH x=0 and x=96 (clipped by the viewBox) so the pattern
       wraps without a visible cut when repeated. -->
  <rect width="96" height="20" fill="#dfe8f2"/>
  <defs>
    <g id="seamPeak">
      <path fill="#3f4a58" d="M-13 20 L0 4 L13 20 Z"/>
      <path fill="#ffffff" d="M-2.4 7 L0 4 L2.4 7 L0.8 6.2 L0 7.3 L-0.8 6.2 Z"/>
    </g>
  </defs>
  <g fill="#3f4a58">
    <path d="M8 20 L18 8 L30 20 Z"/>
    <path d="M22 20 L38 2 L54 20 Z"/>
    <path d="M46 20 L60 9 L72 20 Z"/>
    <path d="M62 20 L78 5 L94 20 Z"/>
  </g>
  <g fill="#ffffff">
    <path d="M15.9 11 L18 8 L20.1 11 L18.7 10.2 L18 11.2 L17.3 10.2 Z"/>
    <path d="M34.7 5.7 L38 2 L41.3 5.7 L39.4 4.8 L38 6.2 L36.6 4.8 Z"/>
    <path d="M57.4 11.2 L60 9 L62.6 11.2 L61.2 10.7 L60 11.8 L58.8 10.7 Z"/>
    <path d="M74.9 8.1 L78 5 L81.1 8.1 L79.4 7.2 L78 8.6 L76.6 7.2 Z"/>
  </g>
  <use href="#seamPeak"/>
  <use href="#seamPeak" x="96"/>
</svg>
