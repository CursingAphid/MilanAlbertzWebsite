    <rect x="10" y="10" width="124" height="124" stroke="#f5c518"/>
    <rect x="24" y="24" width="96" height="96" stroke="#3d7dc4" stroke-width="2.4"/>
  </g>
  <g fill="#f5c518">
    <rect x="13" y="13" width="22" height="22" transform="rotate(45 24 24)"/>
    <rect x="109" y="13" width="22" height="22" transform="rotate(45 120 24)"/>
    <rect x="13" y="109" width="22" height="22" transform="rotate(45 24 120)"/>
    <rect x="109" y="109" width="22" height="22" transform="rotate(45 120 120)"/>
  </g>
  <g fill="#2e9e4f">
    <circle cx="24" cy="24" r="6"/>
    <circle cx="120" cy="24" r="6"/>
