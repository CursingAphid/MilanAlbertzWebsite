<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
  <!-- the China card's country scene, in daylight: the Great Wall riding
       the crest of a green mountain, a red pagoda and shrine below, the
       loong's shadow crossing the sky. Mist drifts via SMIL.
       Generated by scripts/build-china.py. -->
  <defs>
    <linearGradient id="gwSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d74c0" stop-opacity="0.96"/>
      <stop offset="0.65" stop-color="#7fa9d8" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#c2d9ea" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="gwValley" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c4230"/>
      <stop offset="1" stop-color="#182a1c"/>
    </linearGradient>
    <filter id="gwSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="400" height="470" fill="url(#gwSky)"/>
  <!-- morning sun and slow clouds — kept low: the card's cover-crop
       removes roughly the top 185 units on real aspect ratios -->
