<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- round passport-style stamp, German edition: gold ink so it reads on
       the card's dark lake water -->
  <defs>
    <path id="deTopArc" d="M50 50m-27 0a27 27 0 1 1 54 0"/>
    <path id="deBottomArc" d="M50 50m-26 0a26 26 0 1 0 52 0"/>
  </defs>
  <g fill="none" stroke="#e8c34a" opacity="0.92">
    <circle cx="50" cy="50" r="46" stroke-width="2.6"/>
    <circle cx="50" cy="50" r="41.5" stroke-width="1.2"/>
  </g>
  <g fill="#e8c34a" opacity="0.92" font-family="Helvetica, Arial, sans-serif">
    <text font-size="8" font-weight="bold" letter-spacing="1">
      <textPath href="#deTopArc" startOffset="50%" text-anchor="middle">DEUTSCHLAND</textPath>
    </text>
    <text font-size="8" letter-spacing="5">
      <textPath href="#deBottomArc" startOffset="50%" text-anchor="middle">★ ★ ★</textPath>
    </text>
    <text x="50" y="53.5" font-size="12" font-weight="bold" letter-spacing="2" text-anchor="middle">PROST</text>
  </g>
  <g stroke="#e8c34a" opacity="0.92" stroke-width="1.1">
    <line x1="34" y1="41.5" x2="66" y2="41.5"/>
    <line x1="34" y1="58.5" x2="66" y2="58.5"/>
  </g>
</svg>
