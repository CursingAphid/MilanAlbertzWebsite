  </g>
  <rect x="6" y="24" width="28" height="9.5" rx="2" fill="#e8c34a"/>
  <rect x="6" y="27.8" width="28" height="0.9" fill="#b8912a"/>
  <g>
    <circle cx="11" cy="28.7" r="1.4" fill="#d8342a"/>
