<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- round passport-style stamp, Chinese edition: vermillion ink -->
  <defs>
    <path id="cnTopArc" d="M50 50m-27 0a27 27 0 1 1 54 0"/>
    <path id="cnBottomArc" d="M50 50m-26 0a26 26 0 1 0 52 0"/>
  </defs>
  <g fill="none" stroke="#ea5a42" opacity="0.95">
