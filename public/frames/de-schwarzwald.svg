      <stop offset="1" stop-color="#ffdca4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deMid" x1="0" y1="0.55" x2="0" y2="1">
      <stop offset="0" stop-color="#75806c"/>
      <stop offset="1" stop-color="#5c6656"/>
