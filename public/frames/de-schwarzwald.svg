<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
  <!-- full-card Schwarzwald for the Germany card: an autumn golden-hour sky
       over forested ridges receding into mist, a Black Forest farmhouse with
       lit windows, a steam train crossing a stone viaduct (SMIL), and the
       Titisee below mirroring the pines. Generated by gen-schwarzwald.py. -->
  <defs>
    <linearGradient id="deSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#575b86" stop-opacity="0.96"/>
      <stop offset="0.46" stop-color="#c2836e" stop-opacity="0.96"/>
      <stop offset="0.8" stop-color="#e8b47e" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#f7e2b4" stop-opacity="0.96"/>
    </linearGradient>
    <radialGradient id="deGlow" cx="0.36" cy="0.98" r="0.62">
