      <stop offset="1" stop-color="#2b3729"/>
    </linearGradient>
    <linearGradient id="deLake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31434b"/>
      <stop offset="0.5" stop-color="#20303a"/>
      <stop offset="1" stop-color="#141f28"/>
    </linearGradient>
    <filter id="deBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="deBlurSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
