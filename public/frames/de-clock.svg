<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 62">
  <!-- Black Forest cuckoo clock: carved gable, cuckoo hatch, dial, pendulum
       and two pine-cone weights on their chains -->
  <path d="M4 16 L20 3 L36 16 Z" fill="#5c3f26"/>
  <path d="M7.5 16 L20 5.8 L32.5 16 Z" fill="#6e4c2e"/>
  <path d="M20 3 L20 16" stroke="#4a3220" stroke-width="1.2"/>
  <rect x="7" y="16" width="26" height="27" rx="1.5" fill="#6e4c2e"/>
  <rect x="7" y="16" width="26" height="27" rx="1.5" fill="none" stroke="#4a3220" stroke-width="1.6"/>
  <!-- cuckoo hatch -->
  <path d="M15.5 22.5 A4.5 4.5 0 0 1 24.5 22.5 L24.5 25 L15.5 25 Z" fill="#3d2917"/>
  <path d="M20 21.5 L21.6 23.6 L20 24.4 L18.4 23.6 Z" fill="#e8c34a"/>
  <!-- dial -->
  <circle cx="20" cy="33" r="7.6" fill="#f2ead6"/>
  <circle cx="20" cy="33" r="7.6" fill="none" stroke="#4a3220" stroke-width="1.3"/>
  <g stroke="#3d2917" stroke-width="1.1" stroke-linecap="round">
    <line x1="20" y1="33" x2="20" y2="28.4"/>
    <line x1="20" y1="33" x2="23.4" y2="34.6"/>
  </g>
  <circle cx="20" cy="33" r="1" fill="#3d2917"/>
  <!-- carved leaf sprigs on the gable -->
  <g fill="#8a6136">
    <ellipse cx="12.5" cy="12.5" rx="2.6" ry="1.3" transform="rotate(-32 12.5 12.5)"/>
    <ellipse cx="27.5" cy="12.5" rx="2.6" ry="1.3" transform="rotate(32 27.5 12.5)"/>
  </g>
  <!-- pendulum -->
  <line x1="20" y1="43" x2="20" y2="53" stroke="#8a6136" stroke-width="1.2"/>
  <circle cx="20" cy="54.5" r="3.2" fill="#c9a24a"/>
  <!-- weights on chains -->
  <g stroke="#9a9a92" stroke-width="0.9">
    <line x1="12" y1="43" x2="12" y2="49"/>
    <line x1="28" y1="43" x2="28" y2="52"/>
  </g>
  <g fill="#7a5326">
    <path d="M12 49 C14.4 51 14.4 55.4 12 57.4 C9.6 55.4 9.6 51 12 49 Z"/>
    <path d="M28 52 C30.4 54 30.4 58.4 28 60.4 C25.6 58.4 25.6 54 28 52 Z"/>
  </g>
</svg>
