    <path d="M-90 610 L-90 356.0 A13.6 8.0 0 0 1 -62.7 356.0 A16.7 15.3 0 0 1 -29.3 356.0 A12.7 10.2 0 0 1 -3.8 356.0 A10.7 6.4 0 0 1 17.6 356.0 A11.3 9.2 0 0 1 40.3 356.0 A10.7 10.0 0 0 1 61.7 356.0 A9.6 5.6 0 0 1 80.8 356.0 A9.7 8.2 0 0 1 100.2 356.0 A11.9 8.5 0 0 1 124.1 356.0 A11.6 9.1 0 0 1 147.3 356.0 A12.2 7.3 0 0 1 171.8 356.0 A12.4 7.9 0 0 1 196.6 356.0 A9.9 8.6 0 0 1 216.4 356.0 A14.4 11.5 0 0 1 245.3 356.0 A16.1 10.9 0 0 1 277.4 356.0 A12.0 8.3 0 0 1 301.5 356.0 A12.2 9.8 0 0 1 326.0 356.0 A9.1 6.4 0 0 1 344.1 356.0 A13.3 8.7 0 0 1 370.6 356.0 A9.2 7.5 0 0 1 389.0 356.0 A9.1 6.8 0 0 1 407.1 356.0 A10.2 5.3 0 0 1 427.6 356.0 A10.4 5.5 0 0 1 448.5 356.0 A10.2 8.2 0 0 1 468.9 356.0 A14.8 9.8 0 0 1 498.5 356.0 L498.5 610 Z" fill="url(#chFog0)" opacity="0.9"/>
  </g>
  <g filter="url(#chSoft)">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 22 0; 0 0" dur="74s" repeatCount="indefinite"/>
    <path d="M-90 610 L-90 392.0 A18.6 14.7 0 0 1 -52.7 392.0 A15.1 8.9 0 0 1 -22.5 392.0 A17.8 16.6 0 0 1 13.0 392.0 A15.3 13.5 0 0 1 43.6 392.0 A11.4 8.4 0 0 1 66.3 392.0 A13.0 9.4 0 0 1 92.3 392.0 A17.1 15.1 0 0 1 126.5 392.0 A16.2 14.5 0 0 1 159.0 392.0 A14.3 8.0 0 0 1 187.5 392.0 A15.6 12.9 0 0 1 218.8 392.0 A18.1 9.3 0 0 1 255.0 392.0 A13.5 8.3 0 0 1 282.0 392.0 A15.7 14.0 0 0 1 313.4 392.0 A13.7 7.1 0 0 1 340.8 392.0 A20.0 17.8 0 0 1 380.8 392.0 A18.7 9.7 0 0 1 418.2 392.0 A13.6 7.9 0 0 1 445.4 392.0 A20.1 11.2 0 0 1 485.7 392.0 A12.3 7.4 0 0 1 510.2 392.0 L510.2 610 Z" fill="url(#chFog1)" opacity="0.94"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -18 0; 0 0" dur="88s" repeatCount="indefinite"/>
    <path d="M-90 610 L-90 446.0 A14.4 13.5 0 0 1 -61.2 446.0 A16.3 15.5 0 0 1 -28.6 446.0 A25.4 15.6 0 0 1 22.2 446.0 A20.2 13.7 0 0 1 62.5 446.0 A18.9 16.2 0 0 1 100.4 446.0 A23.9 14.7 0 0 1 148.2 446.0 A20.5 16.6 0 0 1 189.3 446.0 A21.1 11.7 0 0 1 231.6 446.0 A18.7 13.5 0 0 1 268.9 446.0 A25.1 21.8 0 0 1 319.1 446.0 A22.1 13.8 0 0 1 363.3 446.0 A25.3 15.2 0 0 1 413.8 446.0 A18.1 10.3 0 0 1 450.0 446.0 A21.1 18.1 0 0 1 492.1 446.0 L492.1 610 Z" fill="url(#chFog2)" opacity="0.97"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 14 0; 0 0" dur="96s" repeatCount="indefinite"/>
    <path d="M-90 610 L-90 502.0 A19.2 13.1 0 0 1 -51.6 502.0 A18.0 9.8 0 0 1 -15.5 502.0 A26.4 17.1 0 0 1 37.2 502.0 A23.5 12.8 0 0 1 84.3 502.0 A30.4 24.3 0 0 1 145.0 502.0 A24.7 18.3 0 0 1 194.5 502.0 A20.5 15.7 0 0 1 235.5 502.0 A28.5 16.6 0 0 1 292.5 502.0 A20.0 14.5 0 0 1 332.5 502.0 A19.9 13.6 0 0 1 372.2 502.0 A21.7 11.3 0 0 1 415.6 502.0 A22.8 19.7 0 0 1 461.1 502.0 A25.6 15.2 0 0 1 512.4 502.0 L512.4 610 Z" fill="url(#chFog3)" opacity="1.0"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -11 0; 0 0" dur="108s" repeatCount="indefinite"/>
    <path d="M-90 610 L-90 556.0 A24.4 21.5 0 0 1 -41.2 556.0 A26.5 21.6 0 0 1 11.8 556.0 A26.7 22.9 0 0 1 65.2 556.0 A32.3 17.0 0 0 1 129.8 556.0 A37.3 32.8 0 0 1 204.5 556.0 A28.5 21.1 0 0 1 261.4 556.0 A33.5 28.0 0 0 1 328.5 556.0 A35.5 33.2 0 0 1 399.5 556.0 A36.9 22.6 0 0 1 473.3 556.0 A22.3 14.0 0 0 1 517.9 556.0 L517.9 610 Z" fill="url(#chFog4)" opacity="1.0"/>
  </g>

  <rect y="372" width="400" height="228" fill="url(#chDeep)"/>

  <path d="M-6 600 L-6 572 Q60 560 130 570 Q210 580 290 568 Q350 560 406 572 L406 600 Z" fill="#131a2c"/>
</svg>
