      <stop offset="1" stop-color="#5c5578"/>
    </linearGradient>
    <linearGradient id="chFog1" x1="0" y1="392" x2="0" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b8808c"/>
      <stop offset="1" stop-color="#474769"/>
    </linearGradient>
    <linearGradient id="chFog2" x1="0" y1="446" x2="0" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a7290"/>
      <stop offset="1" stop-color="#33345a"/>
    </linearGradient>
    <linearGradient id="chFog3" x1="0" y1="502" x2="0" y2="550" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5d5878"/>
      <stop offset="1" stop-color="#22264a"/>
    </linearGradient>
    <linearGradient id="chFog4" x1="0" y1="556" x2="0" y2="602" gradientUnits="userSpaceOnUse">
