<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
  <!-- full-card Swiss alpenglow for the Switzerland card: the Matterhorn's
       summit catching the first light while its base stays in cold shadow,
       seen from ABOVE the cloud line — the whole lower half is a drifting
       Nebelmeer. A balloon crosses on a slow loop. Deliberately unlike the
       Austria card: no snowfall, no valley, no cable car, dawn not dusk.
       Generated by scripts/build-alpenglow.py. -->
  <defs>
    <linearGradient id="chSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131b3c" stop-opacity="0.97"/>
      <stop offset="0.3" stop-color="#33356a" stop-opacity="0.97"/>
      <stop offset="0.6" stop-color="#755d84" stop-opacity="0.97"/>
      <stop offset="0.84" stop-color="#c0748a" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#eda478" stop-opacity="0.97"/>
    </linearGradient>
    <linearGradient id="chDeep" x1="0" y1="372" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1330" stop-opacity="0"/>
      <stop offset="0.34" stop-color="#0d1330" stop-opacity="0.28"/>
      <stop offset="0.7" stop-color="#0b1029" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#090d22" stop-opacity="0.66"/>
    </linearGradient>
    <filter id="chSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="chHaze" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="chBalloon">
      <path d="M0 0 C-10.5 -2 -13 -11 -13 -18 C-13 -28.5 -7 -37 0 -37 C7 -37 13 -28.5 13 -18 C13 -11 10.5 -2 0 0 Z"/>
    </clipPath>
  </defs>

  <rect width="400" height="400" fill="url(#chSky)"/>

  <!-- the last stars, low in the west -->
  <g fill="#ffffff">
    <circle cx="46" cy="38" r="1.3" opacity="0.75"/>
    <circle cx="128" cy="26" r="1" opacity="0.6"/>
    <circle cx="196" cy="52" r="1.15" opacity="0.65"/>
    <circle cx="292" cy="34" r="1" opacity="0.55"/>
    <circle cx="352" cy="70" r="1.2" opacity="0.6"/>
    <circle cx="86" cy="96" r="1" opacity="0.45"/>
    <circle cx="238" cy="88" r="0.9" opacity="0.4"/>
  </g>

  <!-- neighbouring summits, their tips already lit -->
  <path d="M-10.0 396.0 L26.0 300.0 L58.0 252.0 L92.0 296.0 L120.0 352.0 L138.0 396.0 Z" fill="#232b4e"/>
  <path d="M300.0 396.0 L336.0 306.0 L362.0 258.0 L392.0 312.0 L400.0 342.0 L400.0 396.0 Z" fill="#242c50"/>
  <path d="M96.0 396.0 L124.0 330.0 L150.0 296.0 L172.0 340.0 L186.0 396.0 Z" fill="#1e2646"/>
  <g fill="#f0a173" opacity="0.75">
    <path d="M58.0 252.0 L73.5 272.0 L59.1 276.8 L44.7 272.0 Z"/>
    <path d="M362.0 258.0 L374.2 280.0 L362.2 285.3 L350.1 280.0 Z"/>
    <path d="M150.0 296.0 L158.5 313.0 L147.8 317.1 L137.0 313.0 Z"/>
  </g>

  <!-- the Matterhorn: drawn exactly like its neighbours, just taller -->
  <path d="M171.6 396.0 L198.2 349.8 L209.4 306.4 L220.6 264.4 L233.2 228.0 L245.1 204.2 L250.0 200.0 L255.6 209.8 L262.6 225.2 L276.6 258.8 L293.4 299.4 L315.8 342.8 L339.6 375.0 L355.0 393.2 L355.0 396.0 Z" fill="#28324f"/>
  <path d="M250.0 200.0 L255.6 209.8 L262.6 225.2 L267.9 238.0 L258.4 244.1 L248.8 249.4 L239.3 241.8 L229.7 238.0 L233.2 228.0 L245.1 204.2 Z" fill="#f0a173" opacity="0.78"/>

  <!-- balloon drifting across on a slow loop (Château-d'Œx) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="446 0; -46 0" dur="78s" repeatCount="indefinite"/>
    <g transform="translate(0 292)">
      <g clip-path="url(#chBalloon)">
        <rect x="-14" y="-38" width="28" height="39" fill="#d8232a"/>
        <ellipse cx="-7" cy="-19" rx="3.1" ry="19" fill="#f4f1ea"/>
        <ellipse cx="7" cy="-19" rx="3.1" ry="19" fill="#f4f1ea"/>
        <ellipse cx="0" cy="-19" rx="1.5" ry="19" fill="#b0161c" opacity="0.5"/>
      </g>
      <path d="M-4 0 L-2.6 4.2 M4 0 L2.6 4.2" stroke="#6a5236" stroke-width="0.8"/>
      <rect x="-3.4" y="4" width="6.8" height="4.4" rx="1" fill="#8a6a42"/>
    </g>
  </g>

