    </g>
    <g stroke="#b8792c" stroke-width="4.4">
      <path d="M14.5 8.2 A13 13 0 1 0 25.5 8.2"/>
      <path d="M14.5 8.2 Q18.4 14.2 25.2 20.6"/>
      <path d="M25.5 8.2 Q21.6 14.2 14.8 20.6"/>
    </g>
    <g stroke="#d9a349" stroke-width="1.5" opacity="0.6">
