  <!-- dormer windows: some lit, some dark -->
  <g>
    <rect x="22" y="496" width="12" height="16" rx="5" fill="#e8b04a" opacity="0.9"/>
    <rect x="54" y="498" width="12" height="16" rx="5" fill="#20243a"/>
    <rect x="86" y="496" width="12" height="16" rx="5" fill="#e8b04a" opacity="0.75"/>
    <rect x="150" y="488" width="12" height="16" rx="5" fill="#20243a"/>
    <rect x="184" y="486" width="12" height="16" rx="5" fill="#e8b04a" opacity="0.9"/>
    <rect x="218" y="488" width="12" height="16" rx="5" fill="#20243a"/>
