	c19.323,36.822,42.08,71.58,68.106,103.938H331.569z"/>

  <!-- far rooftop band with Sacré-Cœur on the horizon -->
  <g fill="#575377">
    <rect x="0" y="404" width="30" height="16"/>
    <rect x="40" y="408" width="26" height="12"/>
    <rect x="96" y="402" width="20" height="18"/>
    <rect x="130" y="406" width="30" height="14"/>
