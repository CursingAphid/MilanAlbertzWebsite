<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
  <!-- full-card Paris at l'heure bleue for the France card: lavender-rose
       dusk, Sacré-Cœur tiny on the horizon, the Eiffel Tower mid-distance,
       and big Haussmann mansard roofs with dormers and chimney pots in the
       foreground. Layers are opaque with stepped tones. -->
  <defs>
    <linearGradient id="pSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343a66" stop-opacity="0.96"/>
      <stop offset="0.5" stop-color="#6f6795" stop-opacity="0.96"/>
      <stop offset="0.85" stop-color="#b57f88" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#cf9a8e" stop-opacity="0.96"/>
    </linearGradient>
    <radialGradient id="pGlow" cx="0.55" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#e8a58c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e8a58c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4062"/>
      <stop offset="1" stop-color="#282c47"/>
    </linearGradient>
  </defs>

  <rect width="400" height="440" fill="url(#pSky)"/>
  <rect width="400" height="440" fill="url(#pGlow)"/>

  <!-- the Eiffel Tower (CC0 silhouette), rising from behind the rooftops:
       drawn before the far band so the city hides its feet -->
