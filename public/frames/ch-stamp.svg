<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- round passport-style stamp, Swiss edition: cream ink so it reads on
       the card's dusky cloud sea, with the cross below -->
  <defs>
    <path id="chTopArc" d="M50 50m-27 0a27 27 0 1 1 54 0"/>
  </defs>
  <g fill="none" stroke="#f2ece0" opacity="0.92">
    <circle cx="50" cy="50" r="46" stroke-width="2.6"/>
    <circle cx="50" cy="50" r="41.5" stroke-width="1.2"/>
  </g>
  <g fill="#f2ece0" opacity="0.92" font-family="Helvetica, Arial, sans-serif">
    <text font-size="9" font-weight="bold" letter-spacing="2">
      <textPath href="#chTopArc" startOffset="50%" text-anchor="middle">SCHWEIZ</textPath>
    </text>
    <text x="50" y="53.5" font-size="11" font-weight="bold" letter-spacing="1.5" text-anchor="middle">GRÜEZI</text>
  </g>
  <g fill="#f2ece0" opacity="0.92">
    <rect x="47.8" y="65" width="4.4" height="14" rx="0.6"/>
    <rect x="43" y="69.8" width="14" height="4.4" rx="0.6"/>
  </g>
  <g stroke="#f2ece0" opacity="0.92" stroke-width="1.1">
    <line x1="34" y1="41.5" x2="66" y2="41.5"/>
    <line x1="34" y1="58.5" x2="66" y2="58.5"/>
  </g>
</svg>
