<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
  <!-- full-card Rio sunset for the Brazil card: violet-to-gold tropical
       sky with first stars, the sun sinking into Guanabara Bay, Sugarloaf
       with the bondinho cable car gliding its span (SMIL), warm glints on
       the water, the Copacabana calçadão wave, and foreground palms over
       the darkened beach that keeps the card's text readable. -->
  <defs>
    <linearGradient id="rSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2450" stop-opacity="0.96"/>
      <stop offset="0.55" stop-color="#c84a5a" stop-opacity="0.96"/>
      <stop offset="0.85" stop-color="#f2a04e" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="rBay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d98a5a"/>
      <stop offset="0.45" stop-color="#5a4a7a"/>
      <stop offset="1" stop-color="#26355e"/>
    </linearGradient>
    <linearGradient id="rDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a120c" stop-opacity="0"/>
      <stop offset="1" stop-color="#08100a" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="rMist" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="400" height="250" fill="url(#rSky)"/>
  <!-- first stars in the violet -->
  <g fill="#ffffff">
    <circle cx="42" cy="38" r="1.2" opacity="0.6"/>
    <circle cx="118" cy="24" r="1" opacity="0.5"/>
    <circle cx="204" cy="46" r="1.1" opacity="0.55"/>
    <circle cx="302" cy="30" r="1" opacity="0.5"/>
    <circle cx="360" cy="58" r="1.2" opacity="0.6"/>
    <circle cx="80" cy="70" r="1.3" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="256" cy="66" r="1.2" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.75;0.2" dur="4.2s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="338" cy="92" r="1.1" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.8s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- the sun sinking into the bay -->
  <circle cx="140" cy="238" r="38" fill="#ffe6a8" opacity="0.3"/>
  <circle cx="140" cy="238" r="21" fill="#ffe6a8"/>

  <!-- Sugarloaf and Morro da Urca, with the bondinho on its span -->
  <g fill="#2a2438">
    <path d="M232 250 C238 214 258 190 278 188 C298 190 312 214 318 250 Z"/>
    <path d="M304 250 C310 200 330 148 352 146 C372 148 386 196 392 250 Z"/>
  </g>
  <line x1="278" y1="190" x2="352" y2="148" stroke="#1d1830" stroke-width="1.4"/>
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="278 190; 352 148; 278 190" keyTimes="0;0.5;1" dur="26s" repeatCount="indefinite"/>
    <line x1="0" y1="0" x2="0" y2="5" stroke="#1d1830" stroke-width="1.4"/>
    <rect x="-6" y="5" width="12" height="9" rx="2" fill="#e8e4d8"/>
    <rect x="-4.5" y="7" width="9" height="3.5" fill="#4a6a8a"/>
  </g>

  <!-- Guanabara Bay with warm glints -->
  <rect y="250" width="400" height="140" fill="url(#rBay)"/>
  <g fill="#ffd9a0">
    <ellipse cx="112" cy="262" rx="5" ry="1.3" opacity="0"><animate attributeName="opacity" values="0;0.85;0" dur="2.6s" begin="0s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="170" cy="270" rx="4" ry="1.1" opacity="0"><animate attributeName="opacity" values="0;0.8;0" dur="3.1s" begin="1.1s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="86" cy="286" rx="4" ry="1.2" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="2.9s" begin="0.6s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="216" cy="296" rx="4.5" ry="1.2" opacity="0"><animate attributeName="opacity" values="0;0.75;0" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="140" cy="316" rx="4" ry="1.1" opacity="0"><animate attributeName="opacity" values="0;0.65;0" dur="3.3s" begin="0.3s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="290" cy="330" rx="4" ry="1.1" opacity="0"><animate attributeName="opacity" values="0;0.6;0" dur="2.8s" begin="2.4s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="60" cy="348" rx="4" ry="1.1" opacity="0"><animate attributeName="opacity" values="0;0.6;0" dur="3s" begin="1.5s" repeatCount="indefinite"/></ellipse>
  </g>

  <!-- THE AMAZON: layered canopy rising out of the sunset haze -->
  <!-- emergent kapok trees, crowns clear of the canopy -->
  <g fill="#2a3626">
    <path d="M114 415 L116 376 L120 376 L122 415 Z"/>
    <path d="M116 378 L105 367 M120 377 L131 366" stroke="#2a3626" stroke-width="2" fill="none"/>
    <path d="M90 380 Q98 358 118 356 Q138 358 146 380 Q131 371 118 372 Q105 371 90 380 Z"/>
  </g>
  <g fill="#232f22">
    <path d="M308 440 L309 402 L312 402 L313 440 Z"/>
    <path d="M292 406 Q300 388 311 387 Q322 388 330 406 Q318 397 311 398 Q302 397 292 406 Z"/>
  </g>
  <!-- back canopy: catching the last warm light -->
  <path d="M0 400 Q15 388 32 396 Q48 384 66 394 Q84 382 102 392 Q120 386 138 394 Q158 383 176 393 Q196 386 214 395 Q232 384 250 393 Q268 387 286 395 Q306 384 324 393 Q342 387 360 396 Q378 385 400 394 L400 600 L0 600 Z" fill="#4a5240"/>
  <path d="M0 400 Q15 388 32 396 Q48 384 66 394 Q84 382 102 392 Q120 386 138 394 Q158 383 176 393 Q196 386 214 395 Q232 384 250 393 Q268 387 286 395 Q306 384 324 393 Q342 387 360 396 Q378 385 400 394"
    fill="none" stroke="#e09060" stroke-width="2.5" opacity="0.3"/>
  <!-- mist drifting between the layers -->
  <rect x="-10" y="408" width="420" height="16" fill="#cfd8e2" opacity="0.1" filter="url(#rMist)"/>
  <!-- mid canopy -->
  <path d="M0 452 Q20 436 42 446 Q60 430 82 442 Q104 432 124 444 Q146 428 168 440 Q188 432 208 444 Q230 430 252 442 Q272 434 292 445 Q314 430 336 442 Q356 434 378 446 Q390 438 400 444 L400 600 L0 600 Z" fill="#2e3c2e"/>
  <rect x="-10" y="458" width="420" height="16" fill="#cfd8e2" opacity="0.12" filter="url(#rMist)"/>
  <!-- ipê rosa and roxo blooming through the mid canopy -->
  <g fill="#d867a8">
    <circle cx="64" cy="440" r="5"/><circle cx="72" cy="435" r="4.5"/>
    <circle cx="80" cy="440" r="5"/><circle cx="70" cy="444" r="4"/>
  </g>
  <g fill="#9a6ad8">
    <circle cx="348" cy="438" r="5"/><circle cx="356" cy="433" r="4.5"/>
    <circle cx="364" cy="438" r="4.5"/><circle cx="354" cy="442" r="4"/>
  </g>
  <!-- palm sprays poking through the front canopy -->
  <g fill="#223224">
    <path d="M66 472 C56 464 45 464 38 469 C48 459 61 461 66 467 C72 459 85 458 94 464 C85 462 74 464 66 472 Z"/>
    <path d="M344 480 C334 472 323 472 316 477 C326 467 339 469 344 475 C350 467 363 466 372 472 C363 470 352 472 344 480 Z"/>
  </g>
  <!-- front canopy -->
  <path d="M0 505 Q24 486 50 498 Q76 480 104 494 Q130 484 156 496 Q184 478 212 492 Q240 484 266 496 Q294 480 322 494 Q348 486 374 498 Q388 490 400 496 L400 600 L0 600 Z" fill="#1a2a1e"/>
  <rect y="505" width="400" height="95" fill="url(#rDeep)"/>
  <!-- blooms and hanging heliconia in the front canopy -->
  <g fill="#d867a8">
    <circle cx="296" cy="490" r="4.5"/><circle cx="304" cy="486" r="4"/>
    <circle cx="311" cy="491" r="4"/>
  </g>
  <g transform="translate(40 0)">
    <path d="M226 496 C228 506 226 514 224 520" fill="none" stroke="#2a4030" stroke-width="1.6"/>
    <path d="M224 506 L218 510 L224 512 Z" fill="#e05038"/>
    <path d="M225 512 L231 516 L225 518 Z" fill="#e05038"/>
    <path d="M223 518 L218 522 L224 524 Z" fill="#ff8c1a"/>
  </g>
  <!-- fireflies in the understory -->
  <g fill="#e8f4a0">
    <circle cx="88" cy="530" r="4" opacity="0"><animate attributeName="opacity" values="0;0.25;0" dur="3.8s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="88" cy="530" r="1.6" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="3.8s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="196" cy="556" r="4" opacity="0"><animate attributeName="opacity" values="0;0.22;0" dur="4.6s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="196" cy="556" r="1.5" opacity="0"><animate attributeName="opacity" values="0;0.85;0" dur="4.6s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="286" cy="536" r="4" opacity="0"><animate attributeName="opacity" values="0;0.25;0" dur="3.2s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="286" cy="536" r="1.6" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="3.2s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="578" r="4" opacity="0"><animate attributeName="opacity" values="0;0.2;0" dur="5s" begin="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="578" r="1.4" opacity="0"><animate attributeName="opacity" values="0;0.8;0" dur="5s" begin="3.2s" repeatCount="indefinite"/></circle>
  </g>
  <!-- giant leaves framing the card's feet -->
  <g fill="#1c2f20">
    <path d="M12 600 C8 560 24 528 56 522 C88 518 108 540 106 566 C104 588 84 600 60 600 Z"/>
    <path d="M60 600 C64 570 76 548 96 540" fill="none" stroke="#0f1a12" stroke-width="2"/>
    <path d="M104 552 L76 560 L102 566 Z" fill="#101c14"/>
    <path d="M98 578 L72 582 L96 588 Z" fill="#101c14"/>
    <path d="M30 528 L44 552 L20 546 Z" fill="#101c14"/>
  </g>
  <g fill="none" stroke="#1c2f20" stroke-linecap="round">
    <path d="M400 556 C372 550 352 564 344 588" stroke-width="3"/>
    <g stroke-width="2">
      <path d="M392 552 L386 542"/>
      <path d="M378 552 L370 543"/>
      <path d="M364 556 L355 549"/>
      <path d="M353 564 L343 559"/>
      <path d="M347 574 L336 571"/>
      <path d="M390 562 L396 572"/>
      <path d="M374 564 L379 575"/>
      <path d="M360 570 L363 582"/>
      <path d="M350 580 L351 592"/>
    </g>
  </g>
</svg>
