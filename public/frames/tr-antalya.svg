<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
  <!-- full-card Antalya for the Turkey card, built VERTICALLY: the old town
       perched on cliff tops (Ottoman houses with jettied upper floors, the
       Yivli Minare), a rust rock face descending most of the card, and the
       Düden waterfall pouring off the cliff into the sea — flow and mist
       animate via SMIL. Deliberately nothing like the Greece card's
       horizontal village-over-beach. -->
  <defs>
    <linearGradient id="dSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4585" stop-opacity="0.96"/>
      <stop offset="0.55" stop-color="#c96a5a" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#f2b06a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="dCliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5643c"/>
      <stop offset="1" stop-color="#6e3f22"/>
    </linearGradient>
    <linearGradient id="dFalls" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#cfe8f0" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="dSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e7a8a"/>
      <stop offset="1" stop-color="#10344c"/>
    </linearGradient>
    <filter id="dSoften" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="400" height="301" fill="url(#dSky)"/>
  <!-- crescent and star -->
  <path d="M326 55 A10 10 0 1 0 326 75 A12.5 12.5 0 1 1 326 55 Z" fill="#f4e8d0" opacity="0.85"/>
  <path d="M339 62 L340.8 65.6 L344.5 67 L340.8 68.4 L339 72 L337.2 68.4 L333.5 67 L337.2 65.6 Z" fill="#f4e8d0" opacity="0.8"/>

  <g transform="translate(0 55)">
  <!-- the old town along the cliff top: jettied Ottoman houses -->
  <g>
    <rect x="18" y="218" width="30" height="14" fill="#e2d2b8"/>
    <rect x="14" y="204" width="38" height="14" fill="#f0e2cc"/>
    <path d="M10 204 L33 190 L56 204 Z" fill="#a84434"/>
    <rect x="64" y="221" width="26" height="11" fill="#e2d2b8"/>
    <rect x="60" y="208" width="34" height="13" fill="#f0e2cc"/>
    <path d="M56 208 L77 195 L98 208 Z" fill="#b04a38"/>
    <rect x="104" y="210" width="30" height="22" fill="#f0e2cc"/>
    <path d="M100 210 L119 197 L138 210 Z" fill="#a84434"/>
    <rect x="145" y="217" width="30" height="15" fill="#e2d2b8"/>
    <rect x="140" y="202" width="40" height="15" fill="#f0e2cc"/>
    <path d="M136 202 L160 187 L184 202 Z" fill="#b04a38"/>
    <rect x="192" y="220" width="26" height="12" fill="#e2d2b8"/>
    <rect x="188" y="207" width="34" height="13" fill="#f0e2cc"/>
    <path d="M184 207 L205 194 L226 207 Z" fill="#a84434"/>
  </g>
  <!-- the mosque: domed prayer hall flanked by twin minarets -->
  <g>
    <rect x="302" y="170" width="7" height="62" fill="#e2d2b8"/>
    <rect x="300" y="184" width="11" height="3.5" fill="#c2b096"/>
    <path d="M300 170 L305.5 150 L311 170 Z" fill="#3f6a74"/>
    <rect x="381" y="170" width="7" height="62" fill="#e2d2b8"/>
    <rect x="379" y="184" width="11" height="3.5" fill="#c2b096"/>
    <path d="M379 170 L384.5 150 L390 170 Z" fill="#3f6a74"/>
    <rect x="308" y="202" width="74" height="30" fill="#f0e2cc"/>
    <path d="M311 202 A10 9 0 0 1 331 202 Z" fill="#4a7580"/>
    <path d="M359 202 A10 9 0 0 1 379 202 Z" fill="#4a7580"/>
    <rect x="326" y="190" width="38" height="12" fill="#e8d8be"/>
    <path d="M324 190 A21 19 0 0 1 366 190 Z" fill="#3f6a74"/>
    <rect x="344" y="163" width="2" height="9" fill="#c9a86a"/>
    <path d="M346.5 160 A2.2 2.2 0 1 0 346.5 164.4 A2.7 2.7 0 1 1 346.5 160 Z" fill="#c9a86a"/>
    <g fill="#3e7a8a">
      <path d="M316 224 A3.5 4.5 0 0 1 323 224 L323 232 L316 232 Z"/>
      <path d="M332 222 A4 5 0 0 1 340 222 L340 232 L332 232 Z"/>
      <path d="M349 222 A4 5 0 0 1 357 222 L357 232 L349 232 Z"/>
      <path d="M366 224 A3.5 4.5 0 0 1 373 224 L373 232 L366 232 Z"/>
    </g>
  </g>
  <!-- windows: dark and teal-shuttered on the upper floors -->
  <g fill="#5a4a3a" opacity="0.85">
    <rect x="24" y="207" width="5" height="8" rx="2"/>
    <rect x="150" y="205" width="5" height="8" rx="2"/>
  </g>
  <g fill="#3e7a8a">
    <rect x="38" y="207" width="6" height="9" rx="2"/>
    <rect x="70" y="210" width="6" height="9" rx="2"/>
    <rect x="116" y="217" width="6" height="9" rx="2"/>
    <rect x="164" y="205" width="6" height="9" rx="2"/>
    <rect x="198" y="210" width="6" height="9" rx="2"/>
  </g>
  <!-- palm on the plateau -->
  <g>
    <path d="M236 232 C238 216 234 206 238 196" fill="none" stroke="#3e5334" stroke-width="3.5"/>
    <g fill="#4a6a3c">
      <path d="M238 196 C228 189 218 189 211 194 C221 184 233 186 238 191 C243 184 255 183 263 189 C255 187 245 189 238 196 Z"/>
      <path d="M238 196 C230 201 224 206 222 213 C225 203 231 198 238 199 C245 198 251 203 254 211 C252 204 246 200 238 196 Z"/>
    </g>
  </g>
  <!-- plateau edge -->
  <rect x="0" y="230" width="400" height="4" fill="#7a8a4e"/>
  <rect x="0" y="234" width="400" height="14" fill="#6e4a2c"/>
  </g>

  <!-- the cliff face -->
  <rect x="0" y="302" width="400" height="184" fill="url(#dCliff)"/>
  <!-- rock facets: big soft tone patches so the face isn't one flat slab -->
  <g stroke="none" transform="translate(0 56)">
    <polygon points="0,246 88,246 112,318 64,392 0,376" fill="#5a3319" opacity="0.12"/>
    <polygon points="150,270 226,258 214,352 158,368" fill="#c9834f" opacity="0.12"/>
    <polygon points="318,246 400,246 400,340 344,352 310,300" fill="#5a3319" opacity="0.1"/>
    <polygon points="40,410 128,398 148,470 66,486 24,462" fill="#c9834f" opacity="0.1"/>
    <polygon points="316,376 386,362 400,430 400,486 330,486 302,430" fill="#5a3319" opacity="0.12"/>
  </g>
  <!-- broken strata and vertical fissures -->
  <g fill="none" stroke="#5a3319" stroke-width="2" opacity="0.3" transform="translate(0 56)">
    <path d="M18 300 Q60 295 104 300"/>
    <path d="M210 336 Q248 331 302 336"/>
    <path d="M330 300 Q360 296 396 300"/>
    <path d="M40 388 Q86 383 138 388"/>
    <path d="M150 434 Q192 429 238 434"/>
    <path d="M320 448 Q352 444 392 448"/>
    <path d="M84 260 L78 306 L90 342"/>
    <path d="M178 282 L186 330 L176 372"/>
    <path d="M348 262 L342 308"/>
    <path d="M118 402 L126 452"/>
    <path d="M370 358 L378 408 L368 452"/>
  </g>
  <g fill="none" stroke="#c9834f" stroke-width="2" opacity="0.25" transform="translate(0 56)">
    <path d="M120 274 Q158 270 200 274"/>
    <path d="M28 348 Q66 344 110 348"/>
    <path d="M312 328 Q346 324 386 328"/>
    <path d="M64 452 Q104 448 148 452"/>
    <path d="M310 404 Q340 400 378 404"/>
  </g>
  <!-- vegetation clinging to ledges -->
  <g fill="#3e5a34" transform="translate(0 56)">
    <ellipse cx="52" cy="291" rx="10" ry="4"/>
    <ellipse cx="62" cy="288" rx="7" ry="3"/>
    <ellipse cx="150" cy="337" rx="9" ry="3.5"/>
    <ellipse cx="141" cy="334" rx="6" ry="2.6"/>
    <ellipse cx="344" cy="311" rx="10" ry="4"/>
    <ellipse cx="354" cy="308" rx="6" ry="2.6"/>
    <ellipse cx="106" cy="429" rx="9" ry="3.5"/>
    <ellipse cx="368" cy="403" rx="9" ry="3.5"/>
    <ellipse cx="203" cy="383" rx="8" ry="3"/>
  </g>

  <!-- the Düden falls: pouring off the cliff into the sea -->
  <rect x="250" y="289" width="52" height="14" fill="#4a2f1a"/>
  <polygon points="252,302 300,302 306,486 246,486" fill="url(#dFalls)"/>
  <ellipse cx="276" cy="303" rx="28" ry="5" fill="#ffffff" opacity="0.8"/>
  <g stroke="#ffffff" fill="none">
    <line x1="258" y1="302" x2="255" y2="486" stroke-width="2.5" stroke-dasharray="16 20" opacity="0.65">
      <animate attributeName="stroke-dashoffset" values="72;0" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="270" y1="302" x2="269" y2="486" stroke-width="3.5" stroke-dasharray="18 18" opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="72;0" dur="1.45s" repeatCount="indefinite"/>
    </line>
    <line x1="284" y1="302" x2="285" y2="486" stroke-width="2.5" stroke-dasharray="14 22" opacity="0.65">
      <animate attributeName="stroke-dashoffset" values="72;0" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="295" y1="302" x2="298" y2="486" stroke-width="3" stroke-dasharray="20 16" opacity="0.55">
      <animate attributeName="stroke-dashoffset" values="72;0" dur="1.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- the sea the falls crash into -->
  <rect y="486" width="400" height="114" fill="url(#dSea)"/>
  <g fill="none" stroke="#cfe8f0" opacity="0.3" stroke-width="1.5">
    <path d="M216 500 Q276 508 336 500"/>
    <path d="M196 514 Q276 524 356 514"/>
  </g>
  <g fill="#ffffff" filter="url(#dSoften)">
    <ellipse cx="276" cy="492" rx="34" ry="10" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.45;0.3" dur="3.6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="252" cy="498" rx="20" ry="7" opacity="0.22">
      <animate attributeName="opacity" values="0.22;0.38;0.22" dur="4.4s" begin="1.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="302" cy="497" rx="22" ry="8" opacity="0.25">
      <animate attributeName="opacity" values="0.25;0.4;0.25" dur="4s" begin="2s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <g fill="none" stroke="#6aa0b0" stroke-width="1.5" opacity="0.15">
    <path d="M0 548 Q100 544 200 548 T400 548"/>
    <path d="M0 578 Q100 574 200 578 T400 578"/>
  </g>
</svg>
