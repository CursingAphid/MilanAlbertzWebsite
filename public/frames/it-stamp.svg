    </text>
    <text x="50" y="53.5" font-size="12" font-weight="bold" letter-spacing="2" text-anchor="middle">CIAO</text>
  </g>
  <g stroke="#d9a916" stroke-width="1.1">
    <line x1="34" y1="41.5" x2="66" y2="41.5"/>
    <line x1="34" y1="58.5" x2="66" y2="58.5"/>
  </g>
